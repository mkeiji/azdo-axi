name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    name: Run PR Agent
    runs-on: ubuntu-latest
    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          openrouter__key: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: openrouter/deepseek/deepseek-v4-flash-0731
          github_action_config.auto_review: true
          github_action_config.auto_describe: false
          github_action_config.auto_improve: false
          github_action_config.pr_actions: "[opened, synchronize]"
